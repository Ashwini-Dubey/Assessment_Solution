name: CI

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        path: .

    - uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install & build frontend
      run: |
        cd star-wars
        npm install
        npm run build
        nohup npm start &
        cd ..

    - uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: Install Python deps
      run: pip install -r requirements.txt

    - name: Run tests
      run: pytest tests -v
